<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coup — offline audio mix render</title>
<style>
  body { font: 13px/1.5 ui-monospace, monospace; margin: 2rem; background: #12100f; color: #e8e2d8; }
  pre { white-space: pre-wrap; }
  #status { color: #d8b26a; }
</style>
</head>
<body>
<p id="status">rendering…</p>
<pre id="out"></pre>
<script type="module">
  import './harness.bundle.js';
  const status = document.getElementById('status');
  const out = document.getElementById('out');
  try {
    // ?mode=solve re-solves every hero clip's gain instead of measuring.
    // ?mode=clips measures each decoded clip raw, outside the graph.
    // ?mode=live drives the live engine (music + every cue) and reports errors.
    const mode = new URLSearchParams(location.search).get('mode');
    const report = mode === 'solve'
      ? { solve: await window.__COUP_AUDIO.solve(), userAgent: navigator.userAgent, rows: [] }
      : mode === 'clips'
        ? { clips: await window.__COUP_AUDIO.inspectClips(), userAgent: navigator.userAgent, rows: [] }
        : mode === 'live'
          ? { live: await window.__COUP_AUDIO.liveSmoke(), userAgent: navigator.userAgent, rows: [] }
        : await window.__COUP_AUDIO.run();
    window.__COUP_REPORT = report;
    status.textContent = 'done — ' + report.rows.length + ' rows';
    out.textContent = JSON.stringify(report, null, 2);
  } catch (err) {
    status.textContent = 'FAILED: ' + (err && err.message ? err.message : String(err));
    window.__COUP_REPORT = { error: String(err) };
  }
</script>
</body>
</html>
